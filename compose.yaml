name: oneshop-dev

x-php-service: &php-service
  image: oneshop-dev-php:8.5.12
  build:
    context: .
    target: dev
  working_dir: /var/www/html
  # On Linux, export LOCAL_UID=$(id -u) and LOCAL_GID=$(id -g) before using Compose.
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  init: true
  volumes:
    - .:/var/www/html
  environment:
    DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
    DB_HOST: "${DB_HOST:-postgres}"
    DB_PORT: "${DB_PORT:-5432}"
    DB_DATABASE: "${DB_DATABASE:-oneshop}"
    DB_USERNAME: "${DB_USERNAME:-oneshop}"
    DB_PASSWORD: "${DB_PASSWORD:-oneshop_local}"
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  depends_on:
    postgres:
      condition: service_healthy
    mariadb:
    image: mariadb:10.11
    profiles: ["hosting"]
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-oneshop}"
      MARIADB_USER: "${DB_USERNAME:-oneshop}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-oneshop_local}"
      MARIADB_ROOT_PASSWORD: oneshop_root_local
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
      condition: service_healthy
  networks:
    - web
    - backend

services:
  app:
    <<: *php-service
    command: ["php-fpm"]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${ONESHOP_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: "${DB_DATABASE:-oneshop}"
      POSTGRES_USER: "${DB_USERNAME:-oneshop}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-oneshop_local}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=hr-HR"
    volumes:
      # PostgreSQL 18 stores PGDATA in a versioned subdirectory of this mount.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  horizon:
    <<: *php-service
    profiles: ["workers"]
    command: ["php", "artisan", "horizon"]
    restart: unless-stopped
    stop_grace_period: 120s

  scheduler:
    <<: *php-service
    profiles: ["workers"]
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    stop_grace_period: 120s

networks:
  web:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
  mariadb-data:
