name: Secret scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: History and staged source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified scanner
        run: bash scripts/install-secret-scanner.sh

      - name: Prove credential detection and push blocking
        run: python3 tests/Security/secret-scanner.py

      - name: Scan history and source with fully redacted output
        run: bash scripts/check-secrets.sh
