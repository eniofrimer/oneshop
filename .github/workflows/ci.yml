name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP 8.5 / ${{ matrix.database }}
    strategy:
      fail-fast: false
      matrix:
        database: [pgsql, mariadb]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: oneshop-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.database }}
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: ${{ matrix.database == 'pgsql' && 'postgres' || 'mariadb' }}
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          printf 'LOCAL_UID=%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'LOCAL_GID=%s\n' "$(id -g)" >> "$GITHUB_ENV"

      - name: Start isolated databases and Redis
        run: |
          docker compose config --quiet
          docker compose --profile hosting up --detach --wait postgres mariadb redis

      - name: Resolve or install PHP dependencies
        id: php_dependencies
        run: |
          docker compose run --build --rm --no-deps -T app sh -lc '
            set -eu
            if [ -f composer.lock ]; then
              composer install --prefer-dist --no-interaction
            else
              composer update --prefer-dist --no-interaction
            fi
            composer validate --strict --no-check-publish
            composer check-platform-reqs
            composer audit --locked --no-interaction
          '

      - name: Install and build frontend assets
        run: |
          docker compose run --rm --no-deps -T app sh -lc '
            set -eu
            if [ -f package-lock.json ]; then
              npm ci --ignore-scripts
            else
              npm install --ignore-scripts
            fi
            npm run build
          '

      - name: Migrate test database and run tests
        run: |
          docker compose run --rm --no-deps -T -e APP_ENV=testing -e DB_DATABASE=oneshop_test app sh -lc '
            set -eu
            php artisan key:generate --force
            php artisan config:clear
            php scripts/assert-test-database.php
            php artisan migrate:fresh --force
            php artisan test
          '

      - name: Check PHP formatting
        if: ${{ !cancelled() && steps.php_dependencies.outcome == 'success' }}
        run: docker compose run --rm --no-deps -T app vendor/bin/pint --test

      - name: Check PHP static analysis
        if: ${{ !cancelled() && steps.php_dependencies.outcome == 'success' }}
        run: docker compose run --rm --no-deps -T app vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --memory-limit=1G

      - name: Verify native hosting configuration
        run: |
          docker compose run --rm --no-deps -T -e APP_ENV=testing -e DB_DATABASE=oneshop_test -e CACHE_STORE=database -e SESSION_DRIVER=database -e QUEUE_CONNECTION=database app sh -lc '
            set -eu
            php artisan oneshop:initialize
            php artisan oneshop:check-runtime --target=cpanel
            php artisan oneshop:check-runtime --target=fastpanel
          '

      - name: Build and smoke-test native release without development packages
        if: ${{ matrix.database == 'mariadb' }}
        run: docker compose run --rm --no-deps -T app bash scripts/build-release.sh

      - name: Preserve native release
        if: ${{ matrix.database == 'mariadb' && success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-${{ github.sha }}
          path: build/oneshop-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Preserve resolved dependency locks
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-locks-${{ github.sha }}-${{ matrix.database }}
          path: |
            composer.lock
            package-lock.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show database logs on failure
        if: ${{ failure() }}
        run: docker compose --profile hosting logs --no-color postgres mariadb redis

      - name: Remove isolated test services
        if: ${{ always() }}
        run: docker compose --profile hosting down --volumes --remove-orphans
