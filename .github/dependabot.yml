version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-php-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-frontend-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Keep runtime upgrades inside the selected compatibility lines.
    # Changing a line requires an intentional platform upgrade and CI review.
    ignore:
      - dependency-name: node
        versions:
          - ">= 25"
      - dependency-name: php
        versions:
          - ">= 8.6"
      - dependency-name: postgres
        versions:
          - ">= 19"
      - dependency-name: redis
        versions:
          - ">= 9"
      - dependency-name: composer
        versions:
          - ">= 3"
